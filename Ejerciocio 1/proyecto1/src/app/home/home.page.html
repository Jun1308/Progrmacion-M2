<ion-header [translucent]="true">

</ion-header>

    <h2>Bienvenidos al primer proyecto en ionic de Juan Echenique</h2>

  </div>
  <div style="display: flex; justify-content: center; margin-top: 30px;">
    <img src="assets/icon/1.jpg" alt="Imagen 1" style="max-width: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
  </div>
</ion-content>
