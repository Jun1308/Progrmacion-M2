<ion-header [translucent]="true">
  <ion-toolbar color="doctora">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="ion-padding welcome-banner" style="background-color: var(--ion-color-doctora); color: var(--ion-color-doctora-contrast); border-radius: 8px; text-align: center; margin-top: 20px;">
    <h2>Bienvenidos al primer proyecto en ionic de Juan Echenique</h2>
    <p>es un poco sencillo espero les guste, trata de probar las rutas y estilos de este framework</p>
  </div>

  <div class="navigation-cards-container">
    <div class="nav-card" routerLink="/contacto">
      <div class="nav-card-icon-container">
        <ion-icon name="call-outline"></ion-icon>
      </div>
      <div class="nav-card-text">
        <h3>Contacto</h3>
        <p>Ver información de contacto y ubicación</p>
      </div>
      <div class="nav-card-arrow">
        &rarr;
      </div>
    </div>

    <div class="nav-card" routerLink="/perfil">
      <div class="nav-card-icon-container">
        <ion-icon name="person-outline"></ion-icon>
      </div>
      <div class="nav-card-text">
        <h3>Mi Perfil</h3>
        <p>Ver y editar la información de tu perfil</p>
      </div>
      <div class="nav-card-arrow">
        &rarr;
      </div>
    </div>
  </div>

  <div class="home-image-container">
    <img src="assets/icon/1.jpg" alt="Imagen 1">
  </div>
</ion-content>
