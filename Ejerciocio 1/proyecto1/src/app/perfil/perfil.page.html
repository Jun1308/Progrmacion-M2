<ion-header [translucent]="true">
  <ion-toolbar color="doctora">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item>
      <ion-input label="Nombre" labelPlacement="floating" placeholder="Ingresa tu nombre" color="doctora"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Apellido" labelPlacement="floating" placeholder="Ingresa tu apellido" color="doctora"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Número de Cédula" labelPlacement="floating" type="number" placeholder="Ingresa tu cédula" color="doctora"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Carrera" labelPlacement="floating" placeholder="Ingresa tu carrera" color="doctora"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Año Cursado" labelPlacement="floating" type="number" placeholder="Ingresa año cursado" color="doctora"></ion-input>
    </ion-item>
  </ion-list>
  
  <div class="ion-padding" style="text-align: center;">
    <ion-button color="doctora">Guardar Información</ion-button>
  </div>
</ion-content>
